{{- if .Values.metronRest.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metron-rest
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/name: metron-rest
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: metron
spec:
  replicas: {{ .Values.metronRest.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: metron-rest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metron-rest
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: metron-rest
          image: "{{ .Values.metronRest.image.repository }}:{{ .Values.metronRest.image.tag }}"
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8082
              protocol: TCP

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.metronRest.config.spring.profiles.active | quote }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.metronRest.kafka.bootstrapServers | quote }}
            - name: ELASTICSEARCH_URL
              value: {{ .Values.metronRest.elasticsearch.url | quote }}
            - name: CASSANDRA_CONTACT_POINTS
              value: {{ .Values.metronRest.cassandra.contactPoints | quote }}
            - name: CASSANDRA_KEYSPACE
              value: {{ .Values.metronRest.cassandra.keyspace | quote }}
            - name: JAVA_OPTS
              value: "-Xmx2g -Xms2g"

          resources:
            {{- toYaml .Values.metronRest.resources | nindent 12 }}

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: metron-rest
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/name: metron-rest
spec:
  type: ClusterIP
  ports:
    - port: 8082
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: metron-rest
{{- end }}
