apiVersion: 1

datasources:
  # Prometheus
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  # Elasticsearch
  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: "metron-*"
    jsonData:
      timeField: "timestamp"
      esVersion: "8.0.0"
      logMessageField: message
      logLevelField: severity
    editable: true

  # PostgreSQL (for Superset)
  - name: Superset
    type: postgres
    access: proxy
    url: superset-db:5432
    database: superset
    user: superset
    secureJsonData:
      password: superset123
    editable: true
