version: '3.8'

# Apache Metron 2.0 - Development Environment
# Lightweight setup for local development and testing

services:
  #############################################################################
  # CORE SERVICES (Minimal Set)
  #############################################################################

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: metron-dev-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - metron-dev

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    container_name: metron-dev-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - metron-dev
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 3

  cassandra:
    image: cassandra:4.1
    hostname: cassandra
    container_name: metron-dev-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: metron-dev
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 200M
    networks:
      - metron-dev

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    hostname: elasticsearch
    container_name: metron-dev-elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
    networks:
      - metron-dev

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    hostname: kibana
    container_name: metron-dev-kibana
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: 'false'
    networks:
      - metron-dev

  flink-jobmanager:
    image: flink:1.18.0-java17
    hostname: flink-jobmanager
    container_name: metron-dev-flink-jobmanager
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    volumes:
      - ./metron-platform/metron-flink/target:/opt/flink/usrlib
    networks:
      - metron-dev

  flink-taskmanager:
    image: flink:1.18.0-java17
    hostname: flink-taskmanager
    container_name: metron-dev-flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 2048m
    volumes:
      - ./metron-platform/metron-flink/target:/opt/flink/usrlib
    networks:
      - metron-dev

  #############################################################################
  # UTILITIES
  #############################################################################

  # Kafka UI for easier management
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    hostname: kafka-ui
    container_name: metron-dev-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: metron-dev
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - metron-dev

  # ElasticHQ for Elasticsearch management
  elastichq:
    image: elastichq/elasticsearch-hq:latest
    hostname: elastichq
    container_name: metron-dev-elastichq
    ports:
      - "5000:5000"
    networks:
      - metron-dev

networks:
  metron-dev:
    driver: bridge
